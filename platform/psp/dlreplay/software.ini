; tools/psp/dlreplay.sh merges this into ppsspp.ini for the run (run_ppsspp.sh EXTRA_INI; restored afterwards).
; PPSSPP's GPU backends keep the GE's frame buffer on the Mac's GPU and copy it to emulated VRAM only on some events, so a
; sceDisplayGetFrameBuf read sees an old or empty frame. The software renderer draws into emulated VRAM itself, and it is
; the closer model of the GE (clipping, depth range, texel rules) anyway.
[Graphics]
SoftwareRenderer = True
SoftwareRendererJit = True

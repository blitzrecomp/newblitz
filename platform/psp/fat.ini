; PPSSPP settings for New Blitz PSP runs (tools/psp/run_ppsspp.sh passes this with --appendconfig): a PSP-1000 with the WLAN
; switch on. run_ppsspp.sh also backs up ~/.config/ppsspp/PSP/SYSTEM/ppsspp.ini and puts it back after the run.
[SystemParam]
PSPModel = 0
[Network]
EnableWlan = True
[Log]
; This PPSSPP logs at debug level (over a million lines in 25 s, which slows the run): warnings only, except PRINTF (the
; game's stdout), BOOT and SCENET at info. 3 = warning, 4 = info, 5 = debug.
SYSTEMLevel = 3
BOOTLevel = 4
COMMONLevel = 3
CPULevel = 3
FILESYSLevel = 3
G3DLevel = 3
HLELevel = 3
JITLevel = 3
LOADERLevel = 3
MPEGLevel = 3
ATRACLevel = 3
MELevel = 3
MEMMAPLevel = 3
SASMIXLevel = 3
SAVESTATELevel = 3
FRAMEBUFLevel = 3
AUDIOLevel = 3
IOLevel = 3
ACHIEVEMENTSLevel = 3
HTTPLevel = 3
PRINTFLevel = 4
TEXREPLACELevel = 3
DEBUGGERLevel = 3
GEDEBUGGERLevel = 3
UILevel = 3
IAPLevel = 3
SCEAUDIOLevel = 3
SCECTRLLevel = 3
SCEDISPLevel = 3
SCEFONTLevel = 3
SCEGELevel = 3
SCEINTCLevel = 3
SCEIOLevel = 3
SCEKERNELLevel = 3
SCEMODULELevel = 3
SCENETLevel = 4
SCERTCLevel = 3
SCESASLevel = 3
SCEUTILLevel = 3
SCEMISCLevel = 3
SCEREGLevel = 3

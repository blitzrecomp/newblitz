# N64Recomp config for NFL Blitz 2000 (USA, v1.1).
# Generate inputs first: make rom-import && make syms
[input]
entrypoint = 0x80000400
# Paths are relative to this file.
output_func_path = "build/RecompiledFuncs"
symbols_file_path = "build/syms/blitz2000.syms.toml"
rom_file_path = "build/baserom.z64"
recomp_include = "#include \"recomp.h\"\n#include \"blitz_hooks.h\""

[patches]
# Implemented in src/game/threads.cpp: libultra semantics for thread control that the runtime
# lacks (stopping/starting/re-prioritising other threads, yielding).
ignored = ["blitz_osStopThread", "blitz_osStartThread", "blitz_osSetThreadPri", "blitz_osYieldThread",
           "blitz_osDestroyThread",
           # The game's debug printf, implemented in src/game/debug_print.cpp.
           "blitz_debug_printf", "blitz_debug_printf_2",
           # Controller Pak hardware layer, implemented in src/game/controller_pak.cpp.
           "blitz_ContRamRead", "blitz_ContRamWrite", "blitz_PfsGetStatus", "blitz_osMotorInit",
           # Audio interface status, implemented in src/game/ai.cpp.
           "blitz_osAiGetStatus", "blitz_osAiGetLength"]

# ovl_a_func_8032421C is no longer stubbed: its `jal 0x80377D20` calls the stadium blob that ovl_a
# 0x803244AC DMAs there (the blob's code loads the stadium textures). The blobs are sections
# ovl_stadium1-5 (tools/gen_syms.py), registered on DMA by src/game/overlays.cpp; the jal is
# ambiguous between them, so N64Recomp resolves it through the runtime function lookup.
stubs = []

# Direct hardware accesses the runtime can't service (see tools/hazards.py, NOTES "Recompile hazards").
# Each is replaced with a nop (0x00000000).

# Pre-NMI (reset) path: SP_STATUS |= SET_HALT (0xA4040010). There is no RSP to halt on PC.
[[patches.instruction]]
func = "sched_thread"
vram = 0x800015D4
value = 0x00000000  # lw   $v0, 0x0($s0)
[[patches.instruction]]
func = "sched_thread"
vram = 0x800015E0
value = 0x00000000  # sw   $v0, 0x0($s0)
[[patches.instruction]]
func = "sched_thread"
vram = 0x80001684
value = 0x00000000  # lw   $v0, 0x0($s0)
[[patches.instruction]]
func = "sched_thread"
vram = 0x80001690
value = 0x00000000  # sw   $v0, 0x0($s0)

# Brightness ramp stored to 0xA8000228 (cartridge domain 2: nothing there on N64, so the
# hardware drops it). Probably arcade leftover. The rest of each function (fade state,
# completion callback) still runs.
[[patches.instruction]]
func = "fade_tick_a8000228"
vram = 0x8027BA68
value = 0x00000000  # sw   $a1, 0x0($a3)
[[patches.instruction]]
func = "fade_set_a8000228"
vram = 0x8027BC60
value = 0x00000000  # sw   $a1, 0x0($a3)

# Code segment registration (src/game/overlays.cpp): the runtime only learns which overlay is
# resident when told the whole range, but the game loads overlays through dma_read in chunks.
# M4 widescreen (src/game/widescreen.cpp): while Expand is on, gfx_build_frame fills the colour buffer
# every frame with its own clear mode (0x8002B684), so the widened sides of 2D-only screens (legal,
# team select) are black instead of keeping old frames. 0x8000F3D4 tests v1 = that mode.
# M4 HUD and full-screen art in widescreen (src/game/gfx_ext.cpp): per-frame state reset, then just
# before sprite_texrect emits each sprite, rect aspect/alignment commands. At 0x8001337C a1 is still
# the sprite list node; at 0x80013DA4 t0 is the display-list cursor pointer (Gfx**).
[[patches.hook]]
func = "gfx_build_frame"
before_vram = 0x8000F218
text = "    blitz_gfx_frame_begin();"

[[patches.hook]]
func = "sprites_draw_fg"
before_vram = 0x80013E54            # the pass is about to set the game's own full-screen scissor
text = "    blitz_gfx_scissor_reset();"

[[patches.hook]]
func = "sprite_draw"
before_vram = 0x8001337C
text = "    blitz_sprite_node(rdram, (int32_t)ctx->r5); blitz_tall_sprite_begin(rdram, (int32_t)ctx->r5);"

[[patches.hook]]
func = "sprite_draw"
before_vram = 0x80013DA4
text = "    blitz_sprite_before_texrect(rdram, (int32_t)ctx->r8);"

[[patches.hook]]
func = "sprite_draw"
before_vram = 0x80013DB0
text = "    blitz_sprite_after_texrect(rdram);"

[[patches.hook]]
func = "gfx_build_frame"
before_vram = 0x8000F3D4
text = "    if (blitz_force_color_clear()) ctx->r3 = 1;"

# Players at the widescreen sides (src/game/widescreen.cpp, docs/notes/WIDESCREEN_CULLING.md). ovl_a 0x802FB6A8 is
# the process that sets each player's on-screen bit (flags +0x1A4, bit 0x2) from the game's camera against the 4:3
# edges. The bit also steers gameplay (off-screen defenders run faster), so it is left as the game computes it; these
# hooks work out a wider answer beside it (s3 = the player; 0x802FB860 the depth test, f18/f10/f8 = x/y/depth, f2 the
# |x| limit, f6 the |y| slope; 0x802FB918 the game's other reason to hide him; 0x802FB928 the join, s0 = player+0x758)
# and hand it only to the player's draw (func_80255180) and his shadow (func_80255E58), where v1 = his flags and s0 =
# him. A picture no wider than 4:3 gets the game's flags back unchanged.
[[patches.hook]]
func = "ovl_a_func_802FB6A8"
before_vram = 0x802FB6A8
text = "    blitz_ws_cull_begin();"
[[patches.hook]]
func = "ovl_a_func_802FB6A8"
before_vram = 0x802FB860
text = "    blitz_ws_cull_test(rdram, ctx);"
[[patches.hook]]
func = "ovl_a_func_802FB6A8"
before_vram = 0x802FB918
text = "    blitz_ws_cull_hidden(ctx);"
[[patches.hook]]
func = "ovl_a_func_802FB6A8"
before_vram = 0x802FB928
text = "    blitz_ws_cull_done(rdram, ctx);"
[[patches.hook]]
func = "func_80255180"
before_vram = 0x802551B4
text = "    ctx->r3 = (gpr)(int32_t)blitz_ws_draw_flags(rdram, (int32_t)ctx->r16, (uint32_t)ctx->r3);"
[[patches.hook]]
func = "func_80255E58"
before_vram = 0x80255E88
text = "    ctx->r3 = (gpr)(int32_t)blitz_ws_draw_flags(rdram, (int32_t)ctx->r16, (uint32_t)ctx->r3);"

# Content packs (src/game/content_pack.cpp). At 0x80001748 dma_read has finished (both the loop exit
# and the size-0 branch land here): s3 = ROM end, s2 = RDRAM end. When the transfer was ovl_b (ROM
# ..0x129A90 -> RDRAM ..0x8033B5B0), its team table and rosters are fresh from ROM: apply the active
# pack. ovl_b 0x802F5360 later copies the chosen teams into main's bss, so menus and gameplay agree.
[[patches.hook]]
func = "dma_read"
before_vram = 0x80001748
text = "    blitz_on_dma_done(rdram, (uint32_t)ctx->r19, (int32_t)ctx->r18);"

[[patches.hook]]
func = "dma_read"
before_vram = 0x800016B8
text = "    blitz_on_code_dma(rdram, (uint32_t)ctx->r4, (int32_t)ctx->r5, (uint32_t)ctx->r6);"

# load_main_segment DMAs main directly with osPiStartDma (ROM 0x2FC20-0x93EC0 -> 0x80248F00).
[[patches.hook]]
func = "load_main_segment"
before_vram = 0x80004970
text = "    blitz_on_code_dma(rdram, 0x2FC20, (int32_t)0x80248F00, 0x642A0);"

# The process system reads its threads' OSThread.state (process+0x40) expecting libultra values
# (4 running, 8 waiting); the runtime stores its own enum there. Right after each such load,
# replace the value with the libultra state (src/game/threads.cpp blitz_libultra_thread_state).
[[patches.hook]]
func = "process_dispatcher"
before_vram = 0x80273FB0
text = "    ctx->r2 = blitz_libultra_thread_state(rdram, (int32_t)(ctx->r5 + 0x30));"

[[patches.hook]]
func = "process_dispatcher"
before_vram = 0x80274060
text = "    ctx->r3 = blitz_libultra_thread_state(rdram, (int32_t)(ctx->r4 + 0x30));"

[[patches.hook]]
func = "func_80274500"
before_vram = 0x802747A0
text = "    ctx->r3 = blitz_libultra_thread_state(rdram, (int32_t)(ctx->r16 + 0x30));"

[[patches.hook]]
func = "func_80274500"
before_vram = 0x802748AC
text = "    ctx->r2 = blitz_libultra_thread_state(rdram, (int32_t)(ctx->r16 + 0x30));"

[[patches.hook]]
func = "func_802749A4"
before_vram = 0x802749F0
text = "    ctx->r2 = blitz_libultra_thread_state(rdram, (int32_t)(ctx->r16 + 0x30));"

[[patches.hook]]
func = "func_802749A4"
before_vram = 0x80274B18
text = "    ctx->r2 = blitz_libultra_thread_state(rdram, (int32_t)(ctx->r16 + 0x30));"

[[patches.hook]]
func = "process_kill"
before_vram = 0x80274E60
text = "    ctx->r3 = blitz_libultra_thread_state(rdram, (int32_t)(ctx->r16 + 0x30));"

[[patches.hook]]
func = "process_kill"
before_vram = 0x80274F78
text = "    ctx->r3 = blitz_libultra_thread_state(rdram, (int32_t)(ctx->r16 + 0x30));"

[[patches.hook]]
func = "func_80275058"
before_vram = 0x802750F0
text = "    ctx->r3 = blitz_libultra_thread_state(rdram, (int32_t)(ctx->r16 + 0x30));"

[[patches.hook]]
func = "func_80275058"
before_vram = 0x8027526C
text = "    ctx->r2 = blitz_libultra_thread_state(rdram, (int32_t)(ctx->r16 + 0x30));"

# process_dispatcher marks a process that stayed WAITING through 100000 polls as RUNNING (4) so
# it gets killed. That store would put a value the runtime doesn't know into its state field;
# dropped (error path only; logged by the game via osSyncPrintf).
[[patches.instruction]]
func = "process_dispatcher"
vram = 0x80274040
value = 0x00000000  # sh   $v0, 0x40($v1)


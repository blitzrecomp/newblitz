# Instant Replay: a REPLAY row in the pause menu (src/game/replay.cpp, docs/REPLAY.md; main func_80262D90, same in team+).
# Four rows, not three: the row loop's count, and the cursor's wrap at both ends. QUIT GAME's row goes from 2 to 3; row 2,

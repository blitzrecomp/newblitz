# Skin tones (src/game/skin_tones.cpp): the game has a light (record skin 1) and a dark set (anything else)
# of arm and face textures; values 2-4 are three tones in between. The render parameters (one 0x44 entry
# per player at 0x802EB2E0) read the record's skin just before these xori: v0 = the raw value, a1 / a0 =
# the entry. The hook notes the tone and returns the base set the game should use (1 light, 0 dark).
[[patches.hook]]
func = "func_80255180"
before_vram = 0x802551FC
text = "    ctx->r2 = (gpr)(int32_t)blitz_skin_param(rdram, (int32_t)ctx->r5, (int32_t)ctx->r2);"
